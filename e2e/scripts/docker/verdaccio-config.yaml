storage: /verdaccio/storage/data
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    timeout: 60s
packages:
  # The packages under test resolve only from local publishes, never from npm,
  # so every install in these tests is provably the build under test.
  '@letta-ai/letta-code':
    access: $all
    publish: $authenticated
  '@letta-ai/letta-acp':
    access: $all
    publish: $authenticated
  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs
server:
  keepAliveTimeout: 60
log: { type: stdout, format: pretty, level: warn }
